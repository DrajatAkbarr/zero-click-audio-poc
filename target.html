<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify Identity</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff; color: #0a0a0a; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 48px 40px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .logo { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: #4285f4; margin-bottom: 32px; }
    .spinner { width: 28px; height: 28px; border: 2px solid #e5e5e5; border-top-color: #4285f4; border-radius: 50%; margin: 0 auto 20px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px; }
    p { font-size: 13px; line-height: 1.6; color: #6b6b6b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Google</div>
    <div class="spinner"></div>
    <h2>Verifying your account</h2>
    <p>Please do not close this tab.</p>
  </div>
</body>
</html>
